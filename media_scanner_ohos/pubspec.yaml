name: media_scanner_ohos
description: OpenHarmony (OHOS) implementation of the media_scanner plugin.
  Uses photoAccessHelper to register media files with the system gallery.
version: 1.0.0
repository: https://github.com/LazyCatLabs/media_scanner

environment:
  sdk: ">=2.18.0 <4.0.0"
  flutter: ">=3.3.0"

flutter:
  plugin:
    implements: media_scanner
    platforms:
      ohos:
        package: io.flutter.plugins.mediascanner
        pluginClass: MediaScannerPlugin
        dartPluginClass: MediaScannerOhos

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
