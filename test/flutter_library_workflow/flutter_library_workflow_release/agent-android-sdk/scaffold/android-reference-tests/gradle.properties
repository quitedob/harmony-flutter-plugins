android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# JDK 17 baseline for this scaffold. If the source SDK uses an older Gradle
# wrapper that cannot run on JDK 17, keep the original SDK read-only and switch
# this copied test project to the pinned wrapper/AGP line instead.
referenceGradleVersion=8.7
referenceAgpVersion=8.6.1
referenceCompileSdk=35
referenceMinSdk=23
referenceNamespace=ohos.adaptation.android.reference.tests

# Set by the 02 planning agent after copying this scaffold.
# Example from .ohos-adaptation/android-reference-tests to an SDK module at repo root/library:
# sourceSdkModuleDir=../../library
sourceSdkModuleDir=../../REPLACE_WITH_SDK_MODULE

# gradle_project: include the original SDK module as :source-sdk.
# source_set: compile the original SDK's src/main/java and resources as read-only
# source roots in :reference-tests. Use this when the original module Gradle
# script is incompatible with JDK 17 / pinned Gradle.
sourceSdkAttachMode=gradle_project
