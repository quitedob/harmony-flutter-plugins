<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>映射分析结果 - 插件跨平台适配工作流</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <div id="moduleNav"></div>
            <div class="brand">
                <a href="/mapping.html" class="back-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                    返回映射库
                </a>
                <h1 id="pageTitle">映射分析结果</h1>
                <p class="brand-sub" id="pageSub">单仓分析结果（只读），用于追溯每条映射的证据与上下文</p>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="table-section">
            <div id="validationBanner" class="error-toast visible" style="position: static; transform:none; left:auto; bottom:auto; margin: 16px; display:none; opacity:1;">
                <div style="text-align:left;">
                    <div style="font-weight:700; margin-bottom:6px;">分析结果未通过校验</div>
                    <div id="validationMsg" style="white-space:pre-wrap;"></div>
                </div>
            </div>
            <div class="mapping-split">
                <!-- Left: list -->
                <aside class="mapping-split-left">
                    <div class="filter-toolbar">
                        <div class="filter-row-top">
                            <div class="filter-search">
                                <svg class="filter-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                                <input type="text" id="resultSearch" placeholder="搜索 Android 符号 / Harmony 替代项...">
                            </div>
                            <span id="resultCount" class="filter-result-count"></span>
                        </div>
                        <div class="filter-row-selects">
                            <select id="resultChangeType" class="filter-select">
                                <option value="">全部变更类型</option>
                                <option value="replace">替换</option>
                                <option value="wrap">封装</option>
                                <option value="conditional">条件编译</option>
                                <option value="remove">移除</option>
                                <option value="manual">人工处理</option>
                            </select>
                            <select id="resultConfidence" class="filter-select">
                                <option value="">全部置信度</option>
                                <option value="high">高</option>
                                <option value="medium">中</option>
                                <option value="low">低</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-wrapper">
                        <table class="mapping-result-table">
                            <thead>
                                <tr>
                                    <th>Android 符号</th>
                                    <th>Harmony 替代</th>
                                    <th>类型</th>
                                </tr>
                            </thead>
                            <tbody id="resultListBody">
                                <tr><td colspan="3" class="empty-state"><p>加载中...</p></td></tr>
                            </tbody>
                        </table>
                    </div>
                </aside>

                <!-- Right: detail -->
                <section class="mapping-split-right">
                    <div class="mapping-detail-meta" id="detailMeta"></div>

                    <div class="mapping-detail-tabs" id="detailTabs">
                        <button class="mdtab active" data-view="summary">概览</button>
                        <button class="mdtab" data-view="field">字段映射</button>
                        <button class="mdtab" data-view="enum">枚举映射</button>
                        <button class="mdtab" data-view="evidence">证据/来源</button>
                    </div>

                    <div class="mapping-detail-view active" id="viewSummary"></div>
                    <div class="mapping-detail-view" id="viewField"></div>
                    <div class="mapping-detail-view" id="viewEnum"></div>
                    <div class="mapping-detail-view" id="viewEvidence"></div>

                    <div id="detailEmpty" class="empty-state" style="display:none; padding:48px 20px;">
                        <p>请在左侧选择一条映射查看详情</p>
                    </div>
                </section>
            </div>
        </section>

        <div id="error" class="error-toast"></div>
    </main>

    <script type="module" src="js/module-nav.js"></script>
    <script type="module" src="mapping-result.js"></script>
</body>
</html>
